<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Segoe UI', sans-serif;
        }


        body{

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );

        }



        .login-box{

            width:420px;
            padding:45px;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(15px);

            border-radius:25px;

            box-shadow:
            0 25px 50px rgba(0,0,0,0.35);

            color:white;

        }



        .logo{

            text-align:center;
            font-size:38px;
            font-weight:800;

            margin-bottom:10px;

            color:#38bdf8;

        }



        .subtitle{

            text-align:center;

            color:#cbd5e1;

            margin-bottom:35px;

        }



        label{

            display:block;

            margin-bottom:8px;

            color:#e2e8f0;

        }



        input{

            width:100%;

            padding:14px;

            border:none;

            outline:none;

            border-radius:12px;

            margin-bottom:20px;

            background:#f8fafc;

            font-size:15px;

        }



        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:#38bdf8;

            color:#0f172a;

            font-size:17px;

            font-weight:700;

            cursor:pointer;

            transition:.3s;

        }



        button:hover{

            transform:translateY(-3px);

            background:#7dd3fc;

        }



        .register{

            text-align:center;

            margin-top:25px;

            color:#cbd5e1;

        }



        .register a{

            color:#38bdf8;

            text-decoration:none;

            font-weight:bold;

        }


    </style>


</head>


<body>


<div class="login-box">


    <div class="logo">
        TaskFlow
    </div>


    <div class="subtitle">
        Manage projects smarter & faster
    </div>



    <form method="POST">

        {% csrf_token %}


        <label>
            Username
        </label>

        <input 
        type="text"
        name="username"
        placeholder="Enter username"
        required>



        <label>
            Password
        </label>

        <input 
        type="password"
        name="password"
        placeholder="Enter password"
        required>



        <button>
            Login
        </button>


    </form>



    <div class="register">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>


</div>


</body>
</html>
